include:
  - docker-compose.dev.yml


services:
  # Adds TLS to services for HTTPS
  traefik:
    image: ${TRAEFIK_VERSION}
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_CERT_DIR}:/certs/:ro
      - ${TRAEFIK_CONF}:/etc/traefik/:ro
      - ${TRAEFIK_LOGS}:/root/logs/:rw
    ports:
      - 80:80     # HTTP
      - 443:443   # HTTPS
      - 8080:8080 # Traefik for `/dashboard` endpoint

      - 8000:8000 # API routing service


  # API routing service; performs load balancing / multiplexes inference servers to a single URL
  litellm:
    image: ${LITELLM_VERSION}
    container_name: litellm
    restart: unless-stopped
    command: >
      --config /app/config.yaml
      --port 8000
      --telemetry False
#    ports:
#      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./litellm-config.yml:/app/config.yaml
    labels:
      - traefik.enable=true

      # Custom middleware specifically for this service
      - traefik.http.middlewares.redirect-litellm-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-litellm-to-https.redirectscheme.port=8000

      # Route HTTP traffic to HTTPS
      - traefik.http.routers.litellm_redirect.entrypoints=litellm
      - traefik.http.routers.litellm_redirect.rule=HostRegexp(`^.+$`)
      - traefik.http.routers.litellm_redirect.middlewares=redirect-litellm-to-https

      # Redirect from HTTPS entrypoint to this service
      - traefik.http.routers.litellm_https.entrypoints=litellm
      - traefik.http.routers.litellm_https.rule=HostRegexp(`^.+$`)
      - traefik.http.routers.litellm_https.tls=true
      - traefik.http.services.litellm.loadbalancer.server.port=8000


  # Stores logged prompts from Langfuse
  core-postgres:
    image: ${DB_VERSION}
    container_name: core-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    # ports:
    #   - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - core-database-data:/var/lib/postgresql/data


volumes:
  core-database-data:
    driver: local

